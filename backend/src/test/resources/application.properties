# ─────────────────────────────────────────────────────────────────
# Maitri Backend — TEST Configuration
# File: src/test/resources/application.properties
#
# This file is automatically picked up by Spring Boot Test when
# running mvn test. It overrides the main application.properties.
#
# Key decisions:
#   - spring.profiles.active is NOT set here (avoids profile cascading)
#   - spring.data.mongodb.uri is set to an embedded placeholder so
#     Flapdoodle (in-memory MongoDB) auto-configures correctly
#   - JWT and admin seed values are safe test-only values
# ─────────────────────────────────────────────────────────────────

# ─── Jackson ──────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ─── MongoDB — Flapdoodle embedded ────────────────────────────────
# de.flapdoodle.embed.mongo.spring3x requires this property name.
# (Different from the old spring31x which used spring.mongodb.embedded.version)
de.flapdoodle.mongodb.embedded.version=4.4.0

# ─── JWT (test-safe values, NOT for production) ───────────────────
# Must be at least 32 characters for HS256.
jwt.secret=maitri-test-jwt-secret-key-for-unit-tests-only-not-production
jwt.expiration.ms=3600000

# ─── Admin Seeding (test-safe values) ────────────────────────────
admin.initial.email=testadmin@maitri.test
admin.initial.password=TestAdmin@2026!
admin.initial.name=Test Admin

# ─── Logging ─────────────────────────────────────────────────────
# Reduce noise during test runs
logging.level.com.maitri=INFO
logging.level.org.springframework.security=WARN
logging.level.de.flapdoodle=WARN
logging.level.org.springframework.data.mongodb=WARN
