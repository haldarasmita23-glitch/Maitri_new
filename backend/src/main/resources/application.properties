# ─────────────────────────────────────────────────────────────────
# Maitri Backend — Common Application Configuration
# File: application.properties
#
# This file is COMMITTED to Git. It contains ONLY non-sensitive,
# common settings that apply to ALL environments (local and production).
#
# Environment-specific settings (like MongoDB URI, JWT secret) live in:
#   application-local.properties  (gitignored — for local development)
#   application-prod.properties   (gitignored — for production)
# ─────────────────────────────────────────────────────────────────

# ─── Application Identity ─────────────────────────────────────────
spring.application.name=maitri-backend
server.port=${PORT:8080}

# ─── Active Profile ───────────────────────────────────────────────
# Controls which application-{profile}.properties file is loaded.
# Override this with the SPRING_PROFILES_ACTIVE environment variable.
# Example: export SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── Jackson JSON Configuration ───────────────────────────────────
# Serialize dates as ISO 8601 strings (not timestamps)
# Example output: "createdAt": "2026-08-13T14:30:00"
spring.jackson.serialization.write-dates-as-timestamps=false

# Use Indian Standard Time for all date/time formatting
spring.jackson.time-zone=Asia/Kolkata

# ─── Server Configuration ─────────────────────────────────────────
# Show the full error message path in responses
# (helpful during development; consider disabling in production)
server.error.include-message=always
server.error.include-binding-errors=always

# ─── Actuator (Future: Health + Metrics endpoints) ────────────────
# We will add spring-boot-starter-actuator in a later phase for
# AWS health checks and monitoring.
# management.endpoints.web.exposure.include=health,info
