# ─────────────────────────────────────────────────────────────────
# Maitri Backend — Production Configuration
# File: application-prod.properties
#
# Loaded automatically when SPRING_PROFILES_ACTIVE=prod
# Uses environment variables set in cloud hosting (Render).
# ─────────────────────────────────────────────────────────────────

# ─── MongoDB ──────────────────────────────────────────────────────
# Production MongoDB Atlas connection string set via MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI}

# ─── JWT Configuration ────────────────────────────────────────────
# Secret key used to sign JWT tokens (minimum 256-bit string)
jwt.secret=${JWT_SECRET}

# JWT token expiry in milliseconds (default: 86400000 = 24 hours)
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS (Production) ────────────────────────────────────────────
# Comma-separated list of allowed frontend origins (e.g. https://maitri.vercel.app)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# ─── Initial Admin Seeding ────────────────────────────────────────
# Used by DataSeeder to create the first admin account on startup if none exists.
admin.initial.email=${ADMIN_INITIAL_EMAIL:admin@maitri.local}
admin.initial.password=${ADMIN_INITIAL_PASSWORD:Admin@123}
admin.initial.name=${ADMIN_INITIAL_NAME:Maitri Admin}

# ─── Logging (Production) ─────────────────────────────────────────
logging.level.com.maitri=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN
