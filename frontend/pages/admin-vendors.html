<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Management — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/pages/admin-vendors.css">
</head>

<body>

  <!-- Ambient Background Blobs -->
  <div class="ambient-blobs" aria-hidden="true">
    <div class="ambient-blob ambient-blob--1"></div>
    <div class="ambient-blob ambient-blob--2"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="main-navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="navbar__inner">
        <a href="../index.html" class="navbar__logo" aria-label="Maitri Home">
          <div class="navbar__logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L14.5 9.5H22L16 14L18.5 21.5L12 17L5.5 21.5L8 14L2 9.5H9.5L12 2Z" fill="white"/>
            </svg>
          </div>
          <span class="navbar__logo-text">Maitr<span>i</span></span>
        </a>

        <div class="navbar__auth" style="margin-left: auto;">
          <a href="admin.html" class="btn btn--outline btn--sm">← Dashboard</a>
          <span id="admin-user-greeting" style="font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">Hello, Admin</span>
          <button id="admin-user-logout" class="btn btn--outline btn--sm">Log Out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="navbar__mobile" id="navbar-mobile">
    <a href="../index.html" class="navbar__mobile-link">🏠 Home</a>
    <a href="admin.html" class="navbar__mobile-link">🛡️ Admin Dashboard</a>
  </div>

  <main class="admin-vendors-page" id="main-content">

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="admin.html">Dashboard</a>
          <span class="breadcrumb__sep" aria-hidden="true">›</span>
          <span class="breadcrumb__current">Vendors</span>
        </nav>
        <h1 data-i18n="admin.vendorManagement">Vendor Management</h1>
        <p data-i18n="admin.vendorManagementDesc">Review and manage vendor applications</p>
      </div>
    </div>

    <div class="container">

      <div class="section-header" style="text-align: left;">
        <h2 data-i18n="admin.pendingVendors" style="font-size: var(--font-size-xl);">Pending Vendors</h2>
        <p data-i18n="admin.pendingVendorsDesc" class="section-subtitle" style="text-align: left; margin: 0;">Vendors awaiting admin approval</p>
      </div>

      <div class="pending-vendors-container" id="pending-vendors-list">
        <!-- Vendors will be populated by JavaScript -->
        <div class="empty-state" id="pending-vendors-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-border)" stroke-width="1.5">
            <circle cx="11" cy="11" r="10"/>
            <line x1="8" y1="14" x2="21" y2="14"/>
            <line x1="8" y1="10" x2="21" y2="10"/>
          </svg>
          <p data-i18n="admin.noPendingVendors">No pending vendors</p>
        </div>
      </div>

    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.copyright">Maitri — Community Platform &copy; 2026</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
