<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/pages/admin-users.css">
</head>

<body>

  <!-- Ambient Background Blobs -->
  <div class="ambient-blobs" aria-hidden="true">
    <div class="ambient-blob ambient-blob--1"></div>
    <div class="ambient-blob ambient-blob--2"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="main-navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="navbar__inner">
        <a href="../index.html" class="navbar__logo" aria-label="Maitri Home">
          <div class="navbar__logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L14.5 9.5H22L16 14L18.5 21.5L12 17L5.5 21.5L8 14L2 9.5H9.5L12 2Z" fill="white"/>
            </svg>
          </div>
          <span class="navbar__logo-text">Maitr<span>i</span></span>
        </a>

        <div class="navbar__auth" style="margin-left: auto;">
          <a href="admin.html" class="btn btn--outline btn--sm">← Dashboard</a>
          <span id="admin-user-greeting" style="font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">Hello, Admin</span>
          <button id="admin-user-logout" class="btn btn--outline btn--sm">Log Out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="navbar__mobile" id="navbar-mobile">
    <a href="../index.html" class="navbar__mobile-link">🏠 Home</a>
    <a href="admin.html" class="navbar__mobile-link">🛡️ Admin Dashboard</a>
  </div>

  <main class="admin-users-page" id="main-content">

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="admin.html">Dashboard</a>
          <span class="breadcrumb__sep" aria-hidden="true">›</span>
          <span class="breadcrumb__current">Users</span>
        </nav>
        <h1 data-i18n="admin.userManagement">User Management</h1>
        <p data-i18n="admin.userManagementDesc">Manage all user accounts on the platform</p>
      </div>
    </div>

    <div class="container">

      <div class="filters-bar">
        <div class="filters-bar__row">
          <div class="filters-bar__group">
            <label for="filter-role" data-i18n="admin.filterRole">Filter by Role</label>
            <select id="filter-role">
              <option value="" data-i18n="admin.allUsers">All Users</option>
              <option value="USER" data-i18n="roles.user">Users</option>
              <option value="VENDOR" data-i18n="roles.vendor">Vendors</option>
              <option value="ADMIN" data-i18n="roles.admin">Admins</option>
            </select>
          </div>
          <div class="filters-bar__group">
            <label for="filter-status" data-i18n="admin.filterStatus">Status</label>
            <select id="filter-status">
              <option value="" data-i18n="admin.allStatuses">All Statuses</option>
              <option value="active" data-i18n="admin.active">Active</option>
              <option value="inactive" data-i18n="admin.inactive">Inactive</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="admin-users-table">
          <thead>
            <tr>
              <th data-i18n="auth.emailLabel">Email</th>
              <th data-i18n="auth.fullNameLabel">Name</th>
              <th data-i18n="admin.roleHeader">Role</th>
              <th data-i18n="common.status">Status</th>
              <th data-i18n="admin.actionsHeader">Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Users will be populated by JavaScript -->
          </tbody>
        </table>

        <div class="empty-state" id="users-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-border)" stroke-width="1.5">
            <circle cx="11" cy="11" r="10"/>
            <line x1="8" y1="14" x2="21" y2="14"/>
            <line x1="8" y1="10" x2="21" y2="10"/>
          </svg>
          <p data-i18n="admin.noUsers">No users found</p>
        </div>
      </div>

    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.copyright">Maitri — Community Platform &copy; 2026</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/admin-users.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
