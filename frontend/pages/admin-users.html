<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/admin-users.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar" id="main-navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="navbar__inner">
        <a href="index.html" class="navbar__logo" aria-label="Maitri Home">
          <div class="navbar__logo-mark" aria-hidden="true">
            <svg viewBox="0 0 22 22" fill="none"><path d="M11 6l1.5 3.5H16l-2.75 2 1 3.5L11 13l-3.25 2 1-3.5L6 9.5h3.5L11 6z" fill="white"/></svg>
          </div>
          <span class="navbar__logo-text">Maitr<span>i</span></span>
        </a>

        <div class="navbar__auth" style="margin-left: auto;">
          <span id="admin-user-greeting">Hello, Admin</span>
          <button id="admin-user-logout" class="btn btn--outline btn--sm">Log Out</button>
        </div>
      </div>
    </nav>

  <div class="navbar__mobile" id="navbar-mobile">
    <a href="index.html" class="navbar__mobile-link">🏠 Home</a>
    <a href="vendors.html" class="navbar__mobile-link">🏪 Browse Vendors</a>
  </div>

  <main class="admin-users-page">

    <div class="page-header">
      <div class="container">
        <h1>User Management</h1>
        <p>Manage all user accounts on the platform</p>
      </div>
    </div>

    <div class="container">

      <div class="filters-bar">
        <div class="filters-bar__row">
          <div class="filters-bar__group">
            <label for="filter-role">Filter by Role</label>
            <select id="filter-role">
              <option value="">All Users</option>
              <option value="USER">Users</option>
              <option value="VENDOR">Vendors</option>
              <option value="ADMIN">Admins</option>
            </select>
          </div>
          <div class="filters-bar__group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="admin-users-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Users will be populated by JavaScript -->
          </tbody>
        </table>

        <div class="empty-state" id="users-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-border)" stroke-width="1.5">
            <circle cx="11" cy="11" r="10"/>
            <line x1="8" y1="14" x2="21" y2="14"/>
            <line x1="8" y1="10" x2="21" y2="10"/>
          </svg>
          <p>No users found</p>
        </div>
      </div>

    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>Maitri — Community Platform &copy; 2026</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/admin-users.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
